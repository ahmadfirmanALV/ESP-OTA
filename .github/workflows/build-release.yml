name: Build and release ESP32 firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Set firmware version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          OTA_MQTT_USERNAME: ${{ secrets.OTA_MQTT_USERNAME }}
          OTA_MQTT_PASSWORD: ${{ secrets.OTA_MQTT_PASSWORD }}
          OTA_MQTT_CA_CERT_PEM: ${{ secrets.OTA_MQTT_CA_CERT_PEM }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"Tag harus berformat vMAJOR.MINOR.PATCH: {version}")
          Path("include/build_version.h").write_text(
              f'#pragma once\n#define OTA_FIRMWARE_VERSION "{version}"\n',
              encoding="utf-8",
          )
          Path("ota_manifest.json").write_text(
              json.dumps(
                  {"ota_protocol": 1, "version": version, "board": "esp32doit-devkit-v1"},
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )
          Path("include/ota_secrets.h").write_text(
              "#pragma once\n"
              "#define OTA_MQTT_USERNAME "
              + json.dumps(os.environ.get("OTA_MQTT_USERNAME", ""))
              + "\n#define OTA_MQTT_PASSWORD "
              + json.dumps(os.environ.get("OTA_MQTT_PASSWORD", ""))
              + "\n#define OTA_MQTT_CA_CERT_PEM "
              + json.dumps(os.environ.get("OTA_MQTT_CA_CERT_PEM", ""))
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build firmware
        run: pio run -e doit_devkit_v1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ESP32 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            .pio/build/doit_devkit_v1/firmware.bin
            ota_manifest.json
