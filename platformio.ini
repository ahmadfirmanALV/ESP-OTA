[platformio]
default_envs = doit_devkit_v1

; Target board: DOIT ESP32 DEVKIT V1, ESP32 klasik dengan flash 4 MB.
[env:doit_devkit_v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    tzapu/WiFiManager@^2.0.17

[env:doit_devkit_v1_ota]
extends = env:doit_devkit_v1
upload_protocol = espota
upload_port = 192.168.211.107
